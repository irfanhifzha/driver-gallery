<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google's thumbnail hosts reject a Referer from this app. The document
         policy also covers context-menu "Open image in new tab", which ignores
         the per-image attribute. API fetches re-enable a referrer explicitly. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta
      name="description"
      content="A responsive gallery for a shared Google Drive photo folder."
    />
    <title>Drive Gallery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
